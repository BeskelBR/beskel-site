<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo BESKEL</title>
  <desc id="desc">Símbolo geométrico em camadas com núcleo laranja e fundo transparente.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad4b"/>
      <stop offset="0.5" stop-color="#f47a20"/>
      <stop offset="1" stop-color="#d95712"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="0.45" stop-color="#8f98a6"/>
      <stop offset="1" stop-color="#3d4652"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linejoin="round">
    <path d="M256 34 448 145v222L256 478 64 367V145Z" stroke="url(#steel)" stroke-width="22"/>
    <path d="M256 82 406 169v174L256 430 106 343V169Z" stroke="#2c333d" stroke-width="18"/>
    <path d="M256 124 370 190v132L256 388 142 322V190Z" stroke="#f47a20" stroke-width="14" opacity=".9"/>
    <path d="M256 160 338 208v96l-82 48-82-48v-96Z" stroke="#66717f" stroke-width="12"/>
  </g>
  <g filter="url(#glow)">
    <path d="M256 190 318 226v72l-62 36-62-36v-72Z" fill="url(#orange)"/>
    <path d="m256 190 62 36-62 36-62-36Z" fill="#ffb45c" opacity=".92"/>
    <path d="m256 262 62-36v72l-62 36Z" fill="#d95d14"/>
    <path d="m256 262-62-36v72l62 36Z" fill="#f47a20"/>
  </g>
</svg>