<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0A3983">
  <title>Página não encontrada | HVB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#0A3983;--cyan:#25B0E6;--surface:#F5F9FC;--ink:#16324F}
    *{box-sizing:border-box}body{margin:0;font-family:"Nunito",sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(720px,100%);background:white;border-radius:24px;padding:48px;box-shadow:0 18px 50px rgba(10,57,131,.12);text-align:center}.logo{width:min(260px,70%);height:auto;margin:0 auto 26px;display:block}.eyebrow{color:var(--cyan);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.card h1{color:var(--blue);font-size:clamp(2rem,5vw,3.4rem);margin:8px 0 12px}.card p{font-size:1.06rem;margin:0 auto 28px;max-width:520px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--blue);color:white;text-decoration:none;font-weight:900}.btn:hover{background:var(--cyan)}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/hvb/brand/logo-hvb-horizontal.webp" alt="Hospital Veterinário Brasília — HVB">
    <div class="eyebrow">Erro 404</div>
    <h1>Página não encontrada.</h1>
    <p>O endereço pode ter mudado ou ainda não estar disponível neste ambiente de desenvolvimento.</p>
    <a class="btn" href="/">Voltar para a Home</a>
  </main>
</body>
</html>
