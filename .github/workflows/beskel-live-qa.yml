name: BESKEL live favicon + SEO QA

on:
  push:
    paths:
      - ".github/workflows/beskel-live-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==10.4.0 playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Verify repository state
        run: |
          mkdir -p qa-output
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import cairosvg, io, json

          master=Path("assets/img/beskel-symbol-master-light.svg")
          favicon=Path("assets/img/favicon-beskel-master-512.png")
          actual=Image.open(favicon)
          actual.verify()
          actual=Image.open(favicon).convert("RGBA")
          assert actual.size==(512,512)

          rendered=cairosvg.svg2png(bytestring=master.read_bytes(),output_height=512)
          symbol=Image.open(io.BytesIO(rendered)).convert("RGBA")
          expected=Image.new("RGBA",(512,512),(0,0,0,0))
          expected.alpha_composite(symbol,((512-symbol.width)//2,0))
          assert ImageChops.difference(actual,expected).getbbox() is None
          expected.save("qa-output/favicon-expected.png")

          home=Path("index.html").read_text(encoding="utf-8")
          assert '<meta name="viewport" content="width=device-width,initial-scale=1">' in home
          assert '<link rel="canonical" href="https://beskel.com.br/">' in home
          assert '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' in home
          assert "rty:og:image" not in home
          assert '<link rel="manifest" href="/site.webmanifest">' in home
          assert '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">' in home
          assert "favicon-beskel-v2.svg" not in home

          manifest=json.loads(Path("site.webmanifest").read_text(encoding="utf-8"))
          assert manifest["icons"]==[{"src":"/assets/img/favicon-beskel-master-512.png","sizes":"512x512","type":"image/png"}]

          redirects=Path("_redirects").read_text(encoding="utf-8")
          assert "/pages/produtos.html /portfolio/ 301" in redirects
          vercel=json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          rule=next(x for x in vercel["redirects"] if x["source"]=="/pages/produtos.html")
          assert rule=={"source":"/pages/produtos.html","destination":"/portfolio/","statusCode":301}

          sitemap=Path("sitemap.xml").read_text(encoding="utf-8")
          assert sitemap.count("<lastmod>2026-09-26</lastmod>")==1
          assert '<loc>https://beskel.com.br/</loc><lastmod>2026-09-26</lastmod>' in sitemap
          print("REPOSITORY_QA_OK")
          PY

      - name: Verify production HTTP chain and assets
        run: |
          set -euo pipefail

          apex_code=$(curl -sS -o /dev/null -D qa-output/apex-home-headers.txt -w "%{http_code}" https://beskel.com.br/)
          test "$apex_code" = "308"
          grep -iE '^location: https://www\.beskel\.com\.br/?' qa-output/apex-home-headers.txt

          curl -fsS https://www.beskel.com.br/ -o qa-output/home-live.html
          grep -F '<link rel="canonical" href="https://beskel.com.br/">' qa-output/home-live.html
          grep -F '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' qa-output/home-live.html
          ! grep -F 'rty:og:image' qa-output/home-live.html
          grep -F '<link rel="manifest" href="/site.webmanifest">' qa-output/home-live.html
          grep -F '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">' qa-output/home-live.html

          curl -fsS https://www.beskel.com.br/site.webmanifest -o qa-output/site.webmanifest
          curl -fsS https://www.beskel.com.br/assets/img/favicon-beskel-master-512.png -o qa-output/favicon-live.png
          python - <<'PY'
          import json
          from PIL import Image, ImageChops
          m=json.load(open("qa-output/site.webmanifest",encoding="utf-8"))
          assert m["icons"]==[{"src":"/assets/img/favicon-beskel-master-512.png","sizes":"512x512","type":"image/png"}]
          live=Image.open("qa-output/favicon-live.png")
          live.verify()
          live=Image.open("qa-output/favicon-live.png").convert("RGBA")
          repo=Image.open("assets/img/favicon-beskel-master-512.png").convert("RGBA")
          assert live.size==(512,512)
          assert ImageChops.difference(live,repo).getbbox() is None
          print("LIVE_ASSET_QA_OK")
          PY

          redirect_code=$(curl -sS -o /dev/null -D qa-output/produtos-www-headers.txt -w "%{http_code}" https://www.beskel.com.br/pages/produtos.html)
          test "$redirect_code" = "301"
          grep -iE '^location: (https://www\.beskel\.com\.br)?/portfolio/?' qa-output/produtos-www-headers.txt

          curl -fsS https://www.beskel.com.br/sitemap.xml -o qa-output/sitemap-live.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse("qa-output/sitemap-live.xml").getroot()
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          vals=[]
          for u in root.findall("s:url",ns):
              loc=u.find("s:loc",ns).text
              lm=u.find("s:lastmod",ns).text
              vals.append((loc,lm))
          assert ("https://beskel.com.br/","2026-09-26") in vals
          assert sum(lm=="2026-09-26" for _,lm in vals)==1
          print("LIVE_REDIRECT_SITEMAP_QA_OK")
          PY

      - name: Desktop and mobile browser QA
        run: |
          cat > /tmp/browser_qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          profiles=[
              ("desktop",{"viewport":{"width":1440,"height":1000},"device_scale_factor":1}),
              ("mobile",{"viewport":{"width":390,"height":844},"device_scale_factor":3,"is_mobile":True,"has_touch":True}),
          ]
          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,opts in profiles:
                  ctx=browser.new_context(**opts)
                  page=ctx.new_page()
                  console_errors=[]
                  page.on("console",lambda msg,errs=console_errors: errs.append(msg.text) if msg.type=="error" else None)
                  response=page.goto("https://beskel.com.br/",wait_until="networkidle",timeout=60000)
                  assert response and response.status==200

                  data=page.evaluate("""() => ({
                    finalUrl: location.href,
                    title: document.title,
                    canonical: document.querySelector('link[rel="canonical"]')?.href,
                    manifest: document.querySelector('link[rel="manifest"]')?.href,
                    favicon: document.querySelector('link[rel="icon"]')?.href,
                    viewport: document.querySelector('meta[name="viewport"]')?.content,
                    ogImage: document.querySelector('meta[property="og:image"]')?.content,
                    horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1
                  })""")

                  assert data["title"]=="BESKEL | Soluções físicas, digitais e híbridas em Brasília"
                  assert data["finalUrl"]=="https://www.beskel.com.br/"
                  assert data["canonical"]=="https://beskel.com.br/"
                  assert data["manifest"]=="https://www.beskel.com.br/site.webmanifest"
                  assert data["favicon"]=="https://www.beskel.com.br/assets/img/favicon-beskel-master-512.png"
                  assert data["viewport"]=="width=device-width,initial-scale=1"
                  assert data["ogImage"]=="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg"
                  assert not data["horizontalOverflow"]

                  page.screenshot(path=f"qa-output/{name}.png",full_page=True)
                  report[name]={**data,"httpStatus":response.status,"consoleErrors":console_errors,"canonicalHostAligned":data["finalUrl"]==data["canonical"]}
                  ctx.close()
              browser.close()

          open("qa-output/browser-report.json","w",encoding="utf-8").write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/browser_qa.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beskel-favicon-seo-live-qa-final
          path: qa-output/
          if-no-files-found: error
          retention-days: 7
