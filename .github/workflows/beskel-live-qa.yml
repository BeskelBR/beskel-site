name: BESKEL repair + live favicon SEO QA

on:
  push:
    paths:
      - ".github/workflows/beskel-live-qa.yml"

permissions:
  contents: write

jobs:
  repair-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==10.4.0 playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Rebuild favicon literally from MASTER
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import cairosvg, io, hashlib

          master = Path("assets/img/beskel-symbol-master-light.svg")
          favicon = Path("assets/img/favicon-beskel-master-512.png")
          assert master.exists(), "MASTER ausente"

          target_h = 512
          target_w = round(493 * target_h / 552)
          rendered = cairosvg.svg2png(
              bytestring=master.read_bytes(),
              output_width=target_w,
              output_height=target_h,
          )
          symbol = Image.open(io.BytesIO(rendered)).convert("RGBA")
          expected = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          expected.alpha_composite(symbol, ((512 - target_w)//2, 0))
          expected.save(favicon, format="PNG", optimize=True)

          actual = Image.open(favicon).convert("RGBA")
          assert actual.size == (512,512)
          assert ImageChops.difference(actual, expected).getbbox() is None
          print("FAVICON_REBUILT_OK", hashlib.sha256(favicon.read_bytes()).hexdigest())
          PY

      - name: Verify repository SEO configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from xml.etree import ElementTree as ET

          home = Path("index.html").read_text(encoding="utf-8")
          assert '<meta name="viewport" content="width=device-width,initial-scale=1">' in home
          assert '<link rel="canonical" href="https://beskel.com.br/">' in home
          assert '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' in home
          assert 'rty:og:image' not in home
          assert '<link rel="manifest" href="/site.webmanifest">' in home
          assert '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">' in home
          assert 'favicon-beskel-v2.svg' not in home

          manifest=json.loads(Path("site.webmanifest").read_text(encoding="utf-8"))
          assert manifest["icons"] == [{
              "src":"/assets/img/favicon-beskel-master-512.png",
              "sizes":"512x512",
              "type":"image/png"
          }]

          redirects=Path("_redirects").read_text(encoding="utf-8")
          assert "/pages/produtos.html /portfolio/ 301" in redirects

          vercel=json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          r=next(x for x in vercel["redirects"] if x.get("source")=="/pages/produtos.html")
          assert r["destination"]=="/portfolio/"
          assert r.get("statusCode")==301

          root=ET.parse("sitemap.xml").getroot()
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          data={}
          for u in root.findall("s:url",ns):
              loc=u.find("s:loc",ns).text
              lm=u.find("s:lastmod",ns)
              data[loc]=lm.text if lm is not None else None
          assert data["https://beskel.com.br/"]=="2026-09-26"
          assert all(v=="2026-09-23" for k,v in data.items() if k!="https://beskel.com.br/")
          print("REPO_SEO_QA_OK")
          PY

      - name: Commit repaired favicon and remove one-shot workflow
        run: |
          rm .github/workflows/beskel-live-qa.yml
          git config user.name "BeskelBR"
          git config user.email "mateus.fis.unb@gmail.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Finaliza favicon MASTER e remove QA temporário"
          git push origin main

      - name: Wait for live deployment and verify HTTP
        run: |
          set -euo pipefail
          mkdir -p qa-output
          expected_sha=$(sha256sum assets/img/favicon-beskel-master-512.png | awk '{print $1}')
          ok=0
          for i in $(seq 1 36); do
            code=$(curl -sS -o qa-output/home.html -w "%{http_code}" https://beskel.com.br/ || true)
            if [ "$code" = "200" ]; then
              curl -sS -f https://beskel.com.br/assets/img/favicon-beskel-master-512.png -o qa-output/favicon-live.png || true
              if [ -s qa-output/favicon-live.png ]; then
                live_sha=$(sha256sum qa-output/favicon-live.png | awk '{print $1}')
                if [ "$live_sha" = "$expected_sha" ]; then ok=1; break; fi
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"

          grep -F '<meta name="viewport" content="width=device-width,initial-scale=1">' qa-output/home.html
          grep -F '<link rel="canonical" href="https://beskel.com.br/">' qa-output/home.html
          grep -F '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' qa-output/home.html
          ! grep -F 'rty:og:image' qa-output/home.html
          grep -F '<link rel="manifest" href="/site.webmanifest">' qa-output/home.html
          grep -F '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">' qa-output/home.html
          ! grep -F 'favicon-beskel-v2.svg' qa-output/home.html

          curl -fsS https://beskel.com.br/site.webmanifest -o qa-output/site.webmanifest
          python - <<'PY'
          import json
          m=json.load(open("qa-output/site.webmanifest",encoding="utf-8"))
          assert m["icons"] == [{
              "src":"/assets/img/favicon-beskel-master-512.png",
              "sizes":"512x512",
              "type":"image/png"
          }]
          print("MANIFEST_LIVE_OK")
          PY

          code=$(curl -sS -o /dev/null -D qa-output/produtos-headers.txt -w "%{http_code}" https://beskel.com.br/pages/produtos.html)
          test "$code" = "301"
          grep -iE '^location: (https://beskel\.com\.br)?/portfolio/?' qa-output/produtos-headers.txt

          curl -fsS https://beskel.com.br/sitemap.xml -o qa-output/sitemap.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse("qa-output/sitemap.xml").getroot()
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          data={}
          for u in root.findall("s:url",ns):
              loc=u.find("s:loc",ns).text
              lm=u.find("s:lastmod",ns)
              data[loc]=lm.text if lm is not None else None
          assert data["https://beskel.com.br/"]=="2026-09-26"
          assert all(v=="2026-09-23" for k,v in data.items() if k!="https://beskel.com.br/")
          print("SITEMAP_LIVE_OK")
          PY

      - name: Desktop and mobile browser QA
        run: |
          cat > /tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          profiles = [
              ("desktop", {"viewport":{"width":1440,"height":1000}, "device_scale_factor":1}),
              ("mobile", {"viewport":{"width":390,"height":844}, "device_scale_factor":3, "is_mobile":True, "has_touch":True}),
          ]

          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,opts in profiles:
                  ctx=browser.new_context(**opts)
                  page=ctx.new_page()
                  errors=[]
                  page.on("console", lambda msg, errors=errors: errors.append(msg.text) if msg.type=="error" else None)
                  response=page.goto("https://beskel.com.br/", wait_until="networkidle", timeout=60000)
                  assert response and response.status==200

                  title=page.title()
                  canonical=page.locator('link[rel="canonical"]').get_attribute("href")
                  manifest=page.locator('link[rel="manifest"]').get_attribute("href")
                  favicon=page.locator('link[rel="icon"]').get_attribute("href")
                  viewport=page.locator('meta[name="viewport"]').get_attribute("content")
                  og_image=page.locator('meta[property="og:image"]').get_attribute("content")

                  assert title=="BESKEL | Soluções físicas, digitais e híbridas em Brasília"
                  assert canonical=="https://beskel.com.br/"
                  assert manifest=="/site.webmanifest"
                  assert favicon=="/assets/img/favicon-beskel-master-512.png"
                  assert viewport=="width=device-width,initial-scale=1"
                  assert og_image=="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg"

                  page.screenshot(path=f"qa-output/{name}.png", full_page=True)
                  report[name]={
                      "status":response.status,
                      "title":title,
                      "canonical":canonical,
                      "manifest":manifest,
                      "favicon":favicon,
                      "viewport":viewport,
                      "og_image":og_image,
                      "console_errors":errors,
                  }
                  ctx.close()
              browser.close()

          open("qa-output/browser-report.json","w",encoding="utf-8").write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/qa.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beskel-favicon-seo-live-qa
          path: qa-output/
          if-no-files-found: ignore
          retention-days: 7
