name: BESKEL live favicon + SEO QA

on:
  push:
    paths:
      - ".github/workflows/beskel-live-qa.yml"

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==10.4.0 playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Regenerate favicon literally from MASTER
        run: |
          mkdir -p qa-output
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import cairosvg, io, xml.etree.ElementTree as ET

          master = Path("assets/img/beskel-symbol-master-light.svg")
          favicon = Path("assets/img/favicon-beskel-master-512.png")
          assert master.exists(), "MASTER ausente"

          root=ET.fromstring(master.read_text(encoding="utf-8"))
          src_w=float(root.attrib["width"])
          src_h=float(root.attrib["height"])
          assert (src_w,src_h)==(493.0,552.0), (src_w,src_h)

          rendered=cairosvg.svg2png(bytestring=master.read_bytes(), output_height=512)
          symbol=Image.open(io.BytesIO(rendered)).convert("RGBA")
          assert symbol.height==512
          expected=Image.new("RGBA",(512,512),(0,0,0,0))
          expected.alpha_composite(symbol,((512-symbol.width)//2,0))
          expected.save(favicon,"PNG",optimize=True)

          actual=Image.open(favicon)
          actual.verify()
          actual=Image.open(favicon).convert("RGBA")
          assert actual.size==(512,512)
          assert actual.getchannel("A").getbbox() is not None
          assert ImageChops.difference(actual,expected).getbbox() is None
          expected.save("qa-output/favicon-expected.png")
          print("FAVICON_LITERAL_MASTER_OK", symbol.size, actual.getchannel("A").getbbox())
          PY

      - name: Commit repaired favicon if needed
        run: |
          git config user.name "BeskelBR"
          git config user.email "mateus.fis.unb@gmail.com"
          git add assets/img/favicon-beskel-master-512.png
          if git diff --cached --quiet; then
            echo "Favicon already matches literal MASTER."
          else
            git commit -m "Corrige favicon raster literal do MASTER"
            git push origin main
          fi
          echo "QA_REPO_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify repository boundaries and SEO state
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          home=Path("index.html").read_text(encoding="utf-8")
          assert '<meta name="viewport" content="width=device-width,initial-scale=1">' in home
          assert '<link rel="canonical" href="https://beskel.com.br/">' in home
          assert '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' in home
          assert "rty:og:image" not in home
          assert '<link rel="manifest" href="/site.webmanifest">' in home
          assert '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">' in home
          assert "favicon-beskel-v2.svg" not in home

          manifest=json.loads(Path("site.webmanifest").read_text(encoding="utf-8"))
          assert manifest["icons"] == [{
              "src":"/assets/img/favicon-beskel-master-512.png",
              "sizes":"512x512",
              "type":"image/png"
          }]

          red=Path("_redirects").read_text(encoding="utf-8")
          assert "/pages/produtos.html /portfolio/ 301" in red
          vercel=json.loads(Path("vercel.json").read_text(encoding="utf-8"))
          rule=next(x for x in vercel["redirects"] if x["source"]=="/pages/produtos.html")
          assert rule=={"source":"/pages/produtos.html","destination":"/portfolio/","statusCode":301}

          sitemap=Path("sitemap.xml").read_text(encoding="utf-8")
          assert '<loc>https://beskel.com.br/</loc><lastmod>2026-09-26</lastmod>' in sitemap
          assert sitemap.count("<lastmod>2026-09-26</lastmod>")==1
          print("REPO_SEO_STATE_OK")
          PY

      - name: Wait for production and verify live HTTP state
        run: |
          set -euo pipefail
          mkdir -p qa-output
          expected_sha=$(sha256sum assets/img/favicon-beskel-master-512.png | awk '{print $1}')
          echo "expected favicon sha256=$expected_sha"

          ok=0
          for i in $(seq 1 30); do
            stamp="$QA_REPO_SHA-$i"
            code=$(curl -L -sS -o qa-output/home.html -w "%{http_code}" "https://beskel.com.br/?qa=$stamp" || true)
            if [ "$code" = "200" ]; then
              curl -L -fsS "https://beskel.com.br/assets/img/favicon-beskel-master-512.png?qa=$stamp" -o qa-output/favicon-live.png || true
              if [ -s qa-output/favicon-live.png ]; then
                live_sha=$(sha256sum qa-output/favicon-live.png | awk '{print $1}')
                if [ "$live_sha" = "$expected_sha" ] && grep -Fq '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' qa-output/home.html; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"

          grep -F '<meta name="viewport" content="width=device-width,initial-scale=1">' qa-output/home.html
          grep -F '<link rel="canonical" href="https://beskel.com.br/">' qa-output/home.html
          grep -F '<meta property="og:image" content="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg">' qa-output/home.html
          ! grep -F 'rty:og:image' qa-output/home.html
          grep -F '<link rel="manifest" href="/site.webmanifest">' qa-output/home.html
          grep -F '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">' qa-output/home.html
          ! grep -F 'favicon-beskel-v2.svg' qa-output/home.html

          curl -L -fsS "https://beskel.com.br/site.webmanifest?qa=$QA_REPO_SHA" -o qa-output/site.webmanifest
          python - <<'PY'
          import json
          from PIL import Image
          m=json.load(open("qa-output/site.webmanifest",encoding="utf-8"))
          assert m["icons"] == [{
              "src":"/assets/img/favicon-beskel-master-512.png",
              "sizes":"512x512",
              "type":"image/png"
          }]
          im=Image.open("qa-output/favicon-live.png")
          im.verify()
          im=Image.open("qa-output/favicon-live.png")
          assert im.size==(512,512)
          print("LIVE_MANIFEST_FAVICON_OK")
          PY

          bare_code=$(curl -sS -o /dev/null -D qa-output/produtos-bare-headers.txt -w "%{http_code}" https://beskel.com.br/pages/produtos.html)
          test "$bare_code" = "308"
          grep -iE '^location: https://www\.beskel\.com\.br/pages/produtos\.html' qa-output/produtos-bare-headers.txt

          www_code=$(curl -sS -o /dev/null -D qa-output/produtos-www-headers.txt -w "%{http_code}" https://www.beskel.com.br/pages/produtos.html)
          test "$www_code" = "301"
          grep -iE '^location: (https://www\.beskel\.com\.br)?/portfolio/?' qa-output/produtos-www-headers.txt

          curl -L -fsS "https://beskel.com.br/sitemap.xml?qa=$QA_REPO_SHA" -o qa-output/sitemap.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse("qa-output/sitemap.xml").getroot()
          ns={"s":"http://www.sitemaps.org/schemas/sitemap/0.9"}
          data={}
          for u in root.findall("s:url",ns):
              loc=u.find("s:loc",ns).text
              lm=u.find("s:lastmod",ns)
              data[loc]=lm.text if lm is not None else None
          assert data["https://beskel.com.br/"]=="2026-09-26"
          assert sum(v=="2026-09-26" for v in data.values())==1
          print("LIVE_REDIRECT_SITEMAP_OK")
          PY

      - name: Desktop and mobile browser QA
        run: |
          cat > /tmp/qa.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          profiles = [
              ("desktop", {"viewport":{"width":1440,"height":1000}, "device_scale_factor":1}),
              ("mobile", {"viewport":{"width":390,"height":844}, "device_scale_factor":3, "is_mobile":True, "has_touch":True}),
          ]
          report={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for name,opts in profiles:
                  ctx=browser.new_context(**opts)
                  page=ctx.new_page()
                  console_errors=[]
                  page.on("console", lambda msg, errors=console_errors: errors.append(msg.text) if msg.type=="error" else None)
                  response=page.goto(f"https://beskel.com.br/?qa={name}",wait_until="networkidle",timeout=60000)
                  assert response and response.status==200

                  data=page.evaluate("""() => ({
                    title: document.title,
                    canonical: document.querySelector('link[rel="canonical"]')?.href,
                    manifest: document.querySelector('link[rel="manifest"]')?.href,
                    favicon: document.querySelector('link[rel="icon"]')?.href,
                    viewport: document.querySelector('meta[name="viewport"]')?.content,
                    ogImage: document.querySelector('meta[property="og:image"]')?.content,
                    legacyFavicon: [...document.querySelectorAll('link')].some(x => (x.href||'').includes('favicon-beskel-v2.svg'))
                  })""")
                  assert data["title"]=="BESKEL | Soluções físicas, digitais e híbridas em Brasília"
                  assert data["canonical"]=="https://beskel.com.br/"
                  assert data["manifest"]=="https://beskel.com.br/site.webmanifest"
                  assert data["favicon"]=="https://beskel.com.br/assets/img/favicon-beskel-master-512.png"
                  assert data["viewport"]=="width=device-width,initial-scale=1"
                  assert data["ogImage"]=="https://beskel.com.br/assets/cases/hvb/portfolio-oficina.jpg"
                  assert not data["legacyFavicon"]

                  page.screenshot(path=f"qa-output/{name}.png",full_page=True)
                  report[name]={**data,"httpStatus":response.status,"consoleErrors":console_errors}
                  ctx.close()
              browser.close()

          open("qa-output/browser-report.json","w",encoding="utf-8").write(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/qa.py

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beskel-favicon-seo-live-qa
          path: qa-output/
          if-no-files-found: error
          retention-days: 7
