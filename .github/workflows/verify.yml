name: HVB Sistema M0-M2
# Manual para não consumir runner/créditos sem decisão do mantenedor.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/hvb-sistema-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hvb-sistema-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar gerenciador fixado
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/configure-env.mjs
      - run: docker compose up -d --wait
      - run: node --env-file=.env scripts/bootstrap.ts
      - run: pnpm db:migrate && pnpm db:seed && pnpm db:seed:inventory && pnpm check
      - name: Contrato consistente
        run: git diff --exit-code -- openapi/hvb-sistema.json
      - name: Parar banco
        if: always()
        run: docker compose down
