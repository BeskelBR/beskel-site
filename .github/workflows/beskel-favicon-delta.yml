name: BESKEL one-shot favicon delta

on:
  push:
    paths:
      - ".github/workflows/beskel-favicon-delta.yml"

permissions:
  contents: write

jobs:
  apply-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rasterize MASTER and apply exact SEO delta
        run: |
          python -m pip install --disable-pip-version-check cairosvg==2.7.1
          python - <<'PY'
          from pathlib import Path
          import json, struct
          import cairosvg

          master = Path("assets/img/beskel-symbol-master-light.svg")
          favicon = Path("assets/img/favicon-beskel-master-512.png")
          home = Path("index.html")
          manifest = Path("site.webmanifest")
          sitemap = Path("sitemap.xml")
          redirects = Path("_redirects")
          vercel = Path("vercel.json")

          assert master.exists(), "MASTER symbol missing"
          master_text = master.read_text(encoding="utf-8")
          assert "BESKEL Simbolo Oficial" in master_text
          assert "favicon-beskel-v2.svg" not in master_text

          cairosvg.svg2png(
              bytestring=master.read_bytes(),
              write_to=str(favicon),
              output_width=512,
              output_height=512,
          )

          png = favicon.read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n"
          width, height = struct.unpack(">II", png[16:24])
          assert (width, height) == (512, 512)

          home_text = home.read_text(encoding="utf-8")
          old_icon = '<link rel="icon" type="image/svg+xml" href="/assets/img/beskel-symbol-master-light.svg">'
          new_icon = '<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-beskel-master-512.png">'
          assert home_text.count(old_icon) == 1
          home_text = home_text.replace(old_icon, new_icon, 1)
          assert '<link rel="canonical" href="https://beskel.com.br/">' in home_text
          assert '<link rel="manifest" href="/site.webmanifest">' in home_text
          assert "favicon-beskel-v2.svg" not in home_text
          home.write_text(home_text, encoding="utf-8")

          manifest_data = json.loads(manifest.read_text(encoding="utf-8"))
          manifest_data["icons"] = [{
              "src": "/assets/img/favicon-beskel-master-512.png",
              "sizes": "512x512",
              "type": "image/png"
          }]
          manifest_text = json.dumps(manifest_data, ensure_ascii=False, indent=2) + "\n"
          assert "favicon-beskel-v2.svg" not in manifest_text
          manifest.write_text(manifest_text, encoding="utf-8")

          sitemap_text = sitemap.read_text(encoding="utf-8")
          old_home = '<url><loc>https://beskel.com.br/</loc><lastmod>2026-09-23</lastmod>'
          new_home = '<url><loc>https://beskel.com.br/</loc><lastmod>2026-09-25</lastmod>'
          assert sitemap_text.count(old_home) == 1
          sitemap_text = sitemap_text.replace(old_home, new_home, 1)
          sitemap.write_text(sitemap_text, encoding="utf-8")

          redirects_text = redirects.read_text(encoding="utf-8")
          assert "/pages/produtos.html /portfolio/ 301" in redirects_text

          vercel_data = json.loads(vercel.read_text(encoding="utf-8"))
          product_redirect = next(
              (r for r in vercel_data.get("redirects", [])
               if r.get("source") == "/pages/produtos.html"),
              None
          )
          assert product_redirect == {
              "source": "/pages/produtos.html",
              "destination": "/portfolio/",
              "permanent": True
          }

          # One-shot helper must not persist in final tree.
          Path(".github/workflows/beskel-favicon-delta.yml").unlink()
          PY

      - name: Verify delta boundaries
        run: |
          git diff --check
          test -f assets/img/favicon-beskel-master-512.png
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "assets/img/favicon-beskel-master-512.png index.html site.webmanifest sitemap.xml "

      - name: Commit final delta
        run: |
          git config user.name "BeskelBR"
          git config user.email "mateus.fis.unb@gmail.com"
          git add -A
          git commit -m "Atualiza favicon MASTER e SEO técnico"
          git push origin main
